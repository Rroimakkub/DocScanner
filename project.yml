# XcodeGen spec. Run `xcodegen generate` in this folder to create DocScanner.xcodeproj.
name: DocScanner

options:
  bundleIdPrefix: com.rroimakkub
  developmentLanguage: th
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DocScanner:
    type: application
    platform: iOS
    sources:
      - path: DocScanner
    settings:
      base:
        PRODUCT_NAME: DocScanner
        # Bundle IDs are unique per Apple account; change this if signing complains it is taken.
        PRODUCT_BUNDLE_IDENTIFIER: com.rroimakkub.docscanner
        INFOPLIST_FILE: DocScanner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your team here, or pick it in Xcode under Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES

schemes:
  DocScanner:
    build:
      targets:
        DocScanner: all
    run:
      config: Debug
    archive:
      config: Release
