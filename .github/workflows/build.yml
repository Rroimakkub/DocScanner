# Builds the app on a macOS runner (no Mac needed locally) and uploads an unsigned .ipa.
# The .ipa must be signed with an Apple ID before it can be installed; see README.md.
name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for iPhone)
        run: |
          set -o pipefail
          xcodebuild \
            -project DocScanner.xcodeproj \
            -scheme DocScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DocScanner.app Payload/
          zip -qry DocScanner-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DocScanner-unsigned-ipa
          path: DocScanner-unsigned.ipa
          retention-days: 14
